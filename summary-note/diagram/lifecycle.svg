<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<style>text {font-family:"Microsoft YaHei","SimHei",sans-serif;fill:#172133} .label {font-size:18px;font-weight:600} .small {font-size:14px;fill:#526277} .arrow {fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)} .dash {stroke-dasharray:6 5}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32" y="38" font-size="24" font-weight="700">Trial 生命周期与异常路径</text>
<text x="32" y="67" class="small">Agent 的过程异常与最终状态评分分别记录</text><path d="M360 178 V230" class="arrow"/><path d="M360 302 V355" class="arrow"/><path d="M360 427 V480" class="arrow"/><path d="M360 552 V605" class="arrow"/><path d="M600 391 H760" class="arrow dash"/><path d="M880 427 V516 H600" class="arrow dash"/><path d="M600 266 H1030 V641 H600" class="arrow dash"/><rect x="120" y="106" width="480" height="72" rx="9" fill="#edf5fc" stroke="#6d9bc5"/><text x="360.0" y="136" text-anchor="middle" class="label">写配置与静态 lock</text><text x="360.0" y="159" text-anchor="middle" class="small">trial_started</text><rect x="120" y="230" width="480" height="72" rx="9" fill="#edf5fc" stroke="#6d9bc5"/><text x="360.0" y="260" text-anchor="middle" class="label">准备 Environment 与 Agent</text><text x="360.0" y="283" text-anchor="middle" class="small">创建目录 / 复制初始文件 / setup</text><rect x="120" y="355" width="480" height="72" rx="9" fill="#edf5fc" stroke="#6d9bc5"/><text x="360.0" y="385" text-anchor="middle" class="label">执行 Agent</text><text x="360.0" y="408" text-anchor="middle" class="small">wait_for 限制执行阶段时长</text><rect x="120" y="480" width="480" height="72" rx="9" fill="#edf5fc" stroke="#6d9bc5"/><text x="360.0" y="510" text-anchor="middle" class="label">独立执行 Verifier</text><text x="360.0" y="533" text-anchor="middle" class="small">读取已有最终文件 / 产生 reward</text><rect x="120" y="605" width="480" height="72" rx="9" fill="#edf5fc" stroke="#6d9bc5"/><text x="360.0" y="635" text-anchor="middle" class="label">清理与持久化</text><text x="360.0" y="658" text-anchor="middle" class="small">结束时间 / TrialResult / trial_finished</text><rect x="760" y="355" width="240" height="72" rx="9" fill="#fff0ee" stroke="#d49a92"/><text x="880.0" y="385" text-anchor="middle" class="label">记录 Agent 异常</text><text x="880.0" y="408" text-anchor="middle" class="small">首个异常 + 已有轨迹</text><text x="707" y="379" class="small">失败</text><text x="801" y="471" class="small">仍尝试评分</text><text x="775" y="284" class="small">准备失败直接进入外层异常处理与清理</text><text x="32" y="717" class="small">评分失败进入外层异常处理；清理失败保留为首个或次级异常。进程崩溃不保证 finally 或落盘完成。</text></svg>