[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-harbor-framework"
version = "0.1.0"
description = "A minimal, educational implementation of Harbor's evaluation loop."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mini-harbor = "mini_harbor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

